<html>
<head>
    <title>CSC3210 Puzzle Pandemonium</title>
    <style>
        body {
            margin: 0;
        }
        #winMessage {
          display: none;
          
          position: fixed;
          left: 50%;
          top: 50%;
          transform: translate(-50%, -50%);
          font-size: 64px;
          color: darkorange;
          z-index: 10;
          animation: sparkle 0.8s infinite alternate;
        }

        @keyframes sparkle {
          from {
            text-shadow: 
                0 0 5px orange,
                0 0 10px orange,
                0 0 20px #ff6600;

          }
          to {
            text-shadow: 
              0 0 10px orange,
              0 0 20px orange,
              0 0 40px #ff6600;

          }
        }
    </style>
</head>
<body>
  <div id="winMessage">
    You Win!
  </div>
    
  <!-- Three.js Dependencies -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script type="module">

// Initializes the Scene
const scene = new THREE.Scene();

const puzzleGroup = new THREE.Group();

scene.add(puzzleGroup);

// Configures the Camera (Perspective Projection)
// Arguments: Field of View (deg), Aspect Ratio, Near Clipping Plane, Far Clipping Plane
const camera = new THREE.PerspectiveCamera(
  35, 
  window.innerWidth / window.innerHeight, 
  0.1, 
  1000
);
camera.position.set(0, 0, 10); // Positions the camera along the +Z axis
camera.lookAt(new THREE.Vector3(0, 0, 0));
scene.add(camera);

// Object that holds the core geometry values of the octagon
const octagon = {
  centerX: 0, 
  centerY: 0,
  radius: 1.75,
  rotationOffset: Math.PI / 8
};

// Function that generates the 8 corner points of the octagon evenly around a circle
function computeOctagonBoundary(octagon) {
  const points = [];
  // For each of the 8 points of a 2D octagon, calculates x and y coordinates using cosine, sine, and an angle
  for (let i = 0; i < 8; i++) {
    const angle = i * (2 * Math.PI / 8) + octagon.rotationOffset;
    const x = octagon.centerX + octagon.radius * Math.cos(angle);
    const y = octagon.centerY + octagon.radius * Math.sin(angle);
    points.push({x, y});
  }
  return points;
}

const octagonBoundary = computeOctagonBoundary(octagon);

// Function that creates the background octagon's mesh
function createOctagonBackgroundMesh() {
  const geometry = new THREE.BufferGeometry();

  // Array that stores the coordinates of every triangle vertex needed to visually make the octagon background
  const vertexList = [];

  // Builds one triangle made up of 3 vertices, 8 times
  for (let i = 0; i < octagonBoundary.length; i++) {
    const current = octagonBoundary[i];
    const next = octagonBoundary[(i + 1) % octagonBoundary.length];

    vertexList.push(octagon.centerX, octagon.centerY, 0);
    vertexList.push(current.x, current.y, 0);
    vertexList.push(next.x, next.y, 0);
  }

  // Converts the vertex list array into a more workable Float32Array
  const vertices = new Float32Array(vertexList);

  // Define per-vertex RGB colors (range 0.0 - 1.0)
  const colors = new Float32Array([
    0.5, 0.5, 0.5,   0.5, 0.5, 0.5,   0.5, 0.5, 0.5,  // Medium gray
    0.5, 0.5, 0.5,   0.5, 0.5, 0.5,   0.5, 0.5, 0.5,  // Medium gray
    0.5, 0.5, 0.5,   0.5, 0.5, 0.5,   0.5, 0.5, 0.5,  // Medium gray
    0.5, 0.5, 0.5,   0.5, 0.5, 0.5,   0.5, 0.5, 0.5,  // Medium gray
    0.5, 0.5, 0.5,   0.5, 0.5, 0.5,   0.5, 0.5, 0.5,  // Medium gray
    0.5, 0.5, 0.5,   0.5, 0.5, 0.5,   0.5, 0.5, 0.5,  // Medium gray
    0.5, 0.5, 0.5,   0.5, 0.5, 0.5,   0.5, 0.5, 0.5,  // Medium gray
    0.5, 0.5, 0.5,   0.5, 0.5, 0.5,   0.5, 0.5, 0.5,  // Medium gray
  ]);

  // Assign position and color attributes (itemSize = 3 components per vertex)
  geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  // Create a material that reads interpolated vertex colors
  const material = new THREE.MeshBasicMaterial({ 
    vertexColors: true, 
    side: THREE.DoubleSide 
  });

  return new THREE.Mesh(geometry, material);
}

// Creates instance of the octagon background mesh and adds it to the scene
const octagonBackgroundMesh = createOctagonBackgroundMesh();
scene.add(octagonBackgroundMesh);

const outlineGeometry = new THREE.BufferGeometry().setFromPoints(octagonBoundary.map(point => new THREE.Vector3(point.x, point.y, 0.02)));
const outlineMaterial = new THREE.LineBasicMaterial({color: 0xffffff});

const octagonOutline = new THREE.LineLoop(outlineGeometry, outlineMaterial);
scene.add(octagonOutline);

// Function that checks whether a given point is inside of the octagon
function isPointInOctagon(point, boundary) {
  for (let i = 0; i < boundary.length; i++) {
    const current = boundary[i];
    const next = boundary[(i + 1) % boundary.length];

    // Compute the cross product of the edge vector (current -> next) and the vector from current to the test point
    const cross = (next.x - current.x) * (point.y - current.y) - (next.y - current.y) * (point.x - current.x);

    // If the cross product is negative, then the point is outside of the edge, returns false
    if (cross < 0) {
      return false;
    }
  }
  // Returns true if the point is inside all of the edges 
  return true;
}

// Configuration for how finely the octagon is subdivided into small triangles
const gridResolution = 500;

// Function that builds a dense array of small triangles in the octagon's interior 
function buildFineTriangleMesh(octagon, boundary, resolution) {
  // Array that stores every small triangle inside of the octagon boundary, each as a group of 3 {x, y} points
  const triangles = [];
  // Width and height of one square grid cell that is based on the bounding box of the octagon and specified resolution
  const cellSize = (2 * octagon.radius) / resolution;

  // Iterates over every cell in a resolution x resolution grid that covers the octagon's bounding box
  for (let i = 0; i < resolution; i++) {
    for (let j = 0; j < resolution; j++) {
      // Calculates the cell's 4 corners
      const x0 = octagon.centerX - octagon.radius + i * cellSize;
      const x1 = x0 + cellSize;
      const y0 = octagon.centerY - octagon.radius + j * cellSize;
      const y1 = y0 + cellSize;
      
      // Calculates the cell's center point given the previous coordinates
      const center = {
        x: (x0 + x1) / 2,
        y: (y0 + y1) / 2
      };

      // Keeps a cell only if the center falls inside of the octagon, and splits the square cell into two triangles
      if (isPointInOctagon(center, boundary)) {
        // Each triangle is stored as an array of 3 vertices
        triangles.push([{x: x0, y: y0}, {x: x1, y: y0}, {x: x0, y: y1}]);
        triangles.push([{x: x1, y: y0}, {x: x1, y: y1}, {x: x0, y: y1}]);
      } 
    }
  }
  return triangles;
}

const fineTriangles = buildFineTriangleMesh(octagon, octagonBoundary, gridResolution);

// IMPORTANT: Configuration for how many puzzle pieces (and therefore seed points) to generate
const pieceCount = 15;

// Max distance a puzzle can be from its home position to snap into place.
const snapThreshold = 0.15;

// Function that generates pieceCount number of random points inside of the octagon, which are used to determine which triangles belong to which piece
function generateSeedPoints(octagon, boundary, count) {
  // Array that stores the acceptable seed points, where one seed point corresponds to one puzzle piece
  const seeds = [];

  // Keeps generating candidate seed points until enough have been found
  while (seeds.length < count) {
    // Generates a random candidate point that is within the octagon's bounding box
    const candidate = {
      x: octagon.centerX + (Math.random() * 2 - 1) * octagon.radius,
      y: octagon.centerY + (Math.random() * 2 - 1) * octagon.radius
    };

    // Keeps the candidate seed point only if it lands inside of octagon, otherwise the loop runs again
    if (isPointInOctagon(candidate, boundary)) {
      seeds.push(candidate);
    }
  }
  return seeds;
}

// Helper function that calculates the centroid, which is the average position of triangle's 3 corner points
function getTriangleCentroid(triangle) {
  const x = (triangle[0].x + triangle[1].x + triangle[2].x) / 3;
  const y = (triangle[0].y + triangle[1].y + triangle[2].y) / 3;
  return {x, y};
}

// Helper function that calculates the distance between 2 points
function getDistance(a, b) {
  const dx = a.x - b.x;
  const dy = a.y - b.y;
  return Math.sqrt(dx * dx + dy * dy);
}

// Function that calculates the closest seed point to the specified point
function findNearestSeedIndex(point, seeds) {
  // Assumes to start that 0 is the closest index, is used as a starting guess to compare to
  let closestIndex = 0;
  // The distance to the current closestIndex, used as a benchmark to compare to
  let closestDistance = getDistance(point, seeds[0]);
  
  // Compares every remaining seed point starting at index 1 against the current closest index
  for (let i = 1; i < seeds.length; i++) {
    const newDistance = getDistance(point, seeds[i]);
    // If the current seed is closer than the current best, it becomes the new closest guess
    if (newDistance < closestDistance) {
      closestDistance = newDistance;
      closestIndex = i;
    }
  }
  // Returns the index of whichever seeds ends up as the closest to the specified point after checking them all
  return closestIndex;
}

// Generates the seed points that the fine triangles will be grouped around
const seedPoints = generateSeedPoints(octagon, octagonBoundary, pieceCount);

// Function that sorts the fine triangles into a bucket that corresponds to a seed point that is based on which seed each triangle's centroid is closest to
function groupTrianglesBySeed(triangles, seeds) {
  // Array that stores one group of triangles per seed point
  const groups = [];

  // Fills groups with empty arrays and makes them ready to sort triangles into
  for (let i = 0; i < seeds.length; i++) {
    groups.push([]);
  }

  // For each triangle, finds the centroid, uses that to calculate the nearest seed index, and then adds the triangle into that seed point's group
  for (let j = 0; j < triangles.length; j++) {
    const centroid = getTriangleCentroid(triangles[j]);
    const nearestSeed = findNearestSeedIndex(centroid, seeds);
    groups[nearestSeed].push(triangles[j]);
  }

  // Returns the completed collection of sorted groups
  return groups;
}

// Function that builds one colored Mesh from a group of triangles that represents a single puzzle piece
function createPieceMesh(triangleGroup, color) {
  const geometry = new THREE.BufferGeometry();

  // Array that stores the flattened x, y, z coordinates of every vertex in this piece's triangles
  const vertexList = [];
  // Flattens every point of every triangle in this group into vertexList as x, y, 0
  for (let i = 0; i < triangleGroup.length; i++) {
    const currentTriangle = triangleGroup[i];
    for (let j = 0; j < 3; j++) {
      const currentVertex = currentTriangle[j];
      vertexList.push(currentVertex.x, currentVertex.y, 0);
    }
  }

  // Converts the vertex list array into a more workable Float32Array
  const vertices = new Float32Array(vertexList);
  geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));

  // Creates a material using this piece's randomly assigned color
  const material = new THREE.MeshBasicMaterial({
    color,
    side: THREE.DoubleSide
  });

  return new THREE.Mesh(geometry, material);
}

// Class that represents a single puzzle piece, where each piece contains an internal id, mesh, home position, and whether or not it is in the right location
class PuzzlePiece {
  constructor(id, mesh) {
    this.id = id;
    this.mesh = mesh;
    this.homePosition = {
      x: 0,
      y: 0
    };
    this.isPlaced = false;
  }
}

// Groups the fine triangles into one bucket per seed point, forming the raw shape of each puzzle piece
const triangleGroups = groupTrianglesBySeed(fineTriangles, seedPoints);

// Array that stores every PuzzlePiece object, one per generated piece
const puzzlePieces = [];

// Builds and adds one mesh per piece group to the scene, each with its own randomly generated color
for (let i = 0; i < triangleGroups.length; i++) {
  const color = new THREE.Color(Math.random(), Math.random(), Math.random());
  const pieceMesh = createPieceMesh(triangleGroups[i], color);
  pieceMesh.position.z = 0.01; // Slightly in front of the background mesh, avoids z-fighting
  puzzleGroup.add(pieceMesh);

  const piece = new PuzzlePiece(i, pieceMesh);

  // Saves the piece's correct x & y positions
  piece.homePosition.x = pieceMesh.position.x;
  piece.homePosition.y = pieceMesh.position.y;

  puzzlePieces.push(piece);
}

// Randomly move each starting piece to a position outside the puzzle area without overlap
function randomizeInitialPieces()
{
  // Storage for the bounding boxes
  let boxes = [];
  // Goes through every puzzle piece in the game
  for (let i = 0; i < puzzlePieces.length; i++)
  {
    let piece = puzzlePieces[i];
    let goodPosition = false;

    // Three.js method for calculating the bounding box of each piece
    piece.mesh.geometry.computeBoundingBox();
    let box = piece.mesh.geometry.boundingBox;

    // Randomly try positions until a good position (non overlapping with octagon or other pieces) is found
    let attempts = 0;
    const maxAttempts = 25000;
    while(!goodPosition && attempts < maxAttempts)
    {
      attempts++;
      // Start with a random position within selected x and y ranges
      let x = Math.random() * 8 - 4;
      let y = Math.random() * 3 - 1.5;

      piece.mesh.position.x = x;
      piece.mesh.position.y = y;
    // Assume position is valid until we test it's not
    goodPosition = true;
    // If any pieces bounding box overlaps the octagons bounding box, it's a bad position.
    if (x + box.min.x < octagon.radius && x + box.max.x > -octagon.radius && y + box.min.y < octagon.radius && y + box.max.y > -octagon.radius)
    {
      goodPosition =false;
    }
    // Check if a certain piece's box overlaps with any other piece's box
    for (let j = 0; j < boxes.length && goodPosition; j++)
      {
        let other = boxes[j];
        if (x + box.min.x < other.maxX && x + box.max.x > other.minX && y + box.min.y < other.maxY && y + box.max.y > other.minY)
        {
          goodPosition = false;
        }
      }
      // If all checks are passed, move the piece and save bounding box for future checks
      if (goodPosition)
      {
        boxes.push({minX: x + box.min.x, maxX: x + box.max.x, minY: y + box.min.y, maxY: y + box.max.y});
      }
    }
    if (!goodPosition)
    {
      randomizeInitialPieces();
      return;
    }
    // Make sure piece's initial position is tracked as not placed correctly.
    piece.isPlaced = false; 
  }
}
// Calls the method to randomize each piece position.
randomizeInitialPieces();

// Checks whether a puzzle piece is close enough to its home position to snap into place.
function trySnapPiece(piece) {
  // Calculates the distance between the piece's current position and its correct home position.
  const distanceFromHome = getDistance(piece.mesh.position, piece.homePosition);

  // Checks if the piece is close enough to its home position to snap into place
  if (distanceFromHome <= snapThreshold) {
    // Moves the piece to its exact home x & y coordinates and marks it as correctly placed.
    piece.mesh.position.x = piece.homePosition.x;
    piece.mesh.position.y = piece.homePosition.y;
    piece.isPlaced = true;

    // Indicates that the piece successfully snapped into place
    return true;
  }
  // Indicates that the piece fails to snap into place
  return false;
}

function checkWin() 
{
  for (let i = 0; i < puzzlePieces.length; i++) 
  {
    if (puzzlePieces[i].isPlaced == false) 
    {
      return false;
    }
  }
  return true;
}

// Sound effect for starting the puzzle game
const gameStartSound = new Audio("sounds/game-start.mp3");
let gameStartSoundPlayed = false;
const clickSound = new Audio("sounds/piece-click.wav");
const correctSound = new Audio("sounds/correct.wav");
const wrongSound = new Audio("sounds/wrong.mp3");
const victorySound = new Audio("sounds/victory.wav");


// Initialize the raycasters (for mouse) and mouse variables
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
// Initialize as having not selected a piece
let selectedPiece = null;
// Stores the offset between the mouse and piece position
let clickOffsetX = 0;
let clickOffsetY = 0;
// Flat plane that the mouse moves across when dragging
const dragPlane = new THREE.Plane(new THREE.Vector3(0,0,1),0);
// Stores the current mouse position on plane
const mousePoint = new THREE.Vector3();

// Initializes the WebGL Renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setClearColor(0x111111, 1.0); // Dark grey background
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);
// Resizes the game when the window is resized so the game doesn't get cut when resized.
window.addEventListener("resize", function()
{
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
})
// Event listeners for holding, moving, and releasing the mouse.
renderer.domElement.addEventListener("mousedown", hold)
renderer.domElement.addEventListener("mousemove", move)
renderer.domElement.addEventListener("mouseup", release)

// Runs when the mouse button is held
function hold(event)
{
  if (victoryAnimation) 
  {
    return;
  }

  if (gameStartSoundPlayed == false) 
  {
    gameStartSound.currentTime = 0.55;
    gameStartSound.play();
    gameStartSoundPlayed = true;
  }

  // Conversions to Three.js coordinates
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

  // Sends the ray from the camera to the mouse
  raycaster.setFromCamera(mouse, camera);

  // Creates a list of all puzzle pieces
  let objects = [];

  for (let i = 0; i < puzzlePieces.length; i++)
  {
    if (puzzlePieces[i].isPlaced == false)
    {
    objects.push(puzzlePieces[i].mesh);
    }
  }

  // Checks which puzzle piece was clicked with the mouse
  let intersections = raycaster.intersectObjects(objects, true);
  if (intersections.length > 0)
  {
    // Selects the first hit piece (meaning the "top" piece on a 2D surface)
    for (let i = 0; i < puzzlePieces.length; i++)
    { 
      if (puzzlePieces[i].mesh === intersections[0].object && puzzlePieces[i].isPlaced == false)
      {
        selectedPiece = intersections[0].object;
        // Stores the offset values of the x and y positions of the mouse
        clickOffsetX = selectedPiece.position.x - intersections[0].point.x;
        clickOffsetY = selectedPiece.position.y - intersections[0].point.y;
        // Plays the sound when the piece snaps into place
        clickSound.currentTime = 0;
        clickSound.play();
        break;
      }
    } 
  }
  else
  {
    selectedPiece = null;
  }
}

// Runs whenever the mouse moves
function move(event)
{
  // Do nothing if you don't select anything
  if (selectedPiece == null)
  {
    return;
  }

  // Converts positions into Three.JS coordinates
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

  // Sends ray from the camera to the mouse
  raycaster.setFromCamera(mouse, camera);

  // Find where the ray hits the puzzle's plane
  raycaster.ray.intersectPlane(dragPlane, mousePoint);

  // Moves the piece while accounting for the move offset
  selectedPiece.position.x = mousePoint.x + clickOffsetX;
  selectedPiece.position.y = mousePoint.y + clickOffsetY;
}

// Runs when you let go of the mouse button
function release()
{
  if (selectedPiece != null) {
    for (let i = 0; i < puzzlePieces.length; i++) 
    {
      if (puzzlePieces[i].mesh === selectedPiece) 
      {
        const didSnap = trySnapPiece(puzzlePieces[i]);

        if (didSnap == true) 
        {
          correctSound.currentTime = 0;
          correctSound.play();
          if (checkWin()) 
          {
            victorySound.currentTime = 0;
            victorySound.play();
            document.getElementById("winMessage").style.display = "block";
            victoryAnimation = true;
          }
        }
        else {
          wrongSound.currentTime = 0;
          wrongSound.play();
        }
        break;
      }
    }
  }
  // Stops moving the selected piece
  selectedPiece = null;
}

let victoryAnimation = false;

// Renders the frame continuously
function animate()
{
  requestAnimationFrame(animate);
  if (victoryAnimation) 
  {
    puzzleGroup.rotation.z += 0.01;
    const pulseScale = 1 + 0.05 * Math.sin(Date.now() / 500);
    for (let i = 0; i < puzzlePieces.length; i++) 
    {
      puzzlePieces[i].mesh.scale.set(pulseScale, pulseScale, 1);
    }
  }
  renderer.render(scene, camera);
}

// Method call to continuously render the frame.
animate();
    </script>
</body>
</html>
