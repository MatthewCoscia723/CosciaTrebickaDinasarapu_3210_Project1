<html>
<head>
    <title>CSC3210 Puzzle Pandemonium</title>
</head>
<body>
    
  <!-- Three.js Dependencies -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script type="module">

// 1. Initialize the Scene
const scene = new THREE.Scene();

// 2. Configure the Camera (Perspective Projection)
// Arguments: Field of View (deg), Aspect Ratio, Near Clipping Plane, Far Clipping Plane
const camera = new THREE.PerspectiveCamera(
  35, 
  window.innerWidth / window.innerHeight, 
  0.1, 
  1000
);
camera.position.set(0, 0, 10); // Position the camera along the +Z axis
camera.lookAt(new THREE.Vector3(0, 0, 0));
scene.add(camera);

// 3. Define Custom Triangle Geometry using BufferGeometry
function createOctagonOutlineMesh() {
  const geometry = new THREE.BufferGeometry();
  
  // Define 3D positions for 3 vertices [x, y, z]
  // All vertices are relative to and will interact with the origin (0,0)
  const vertices = new Float32Array([
    // Triangle 1
    0.00, 0.00, 0.0,   1.75, 0.75, 0.0,   0.75, 1.75, 0.0,
    // Triangle 2
    0.00, 0.00, 0.0,   0.75, 1.75, 0.0,   -0.75,  1.75, 0.0,
    // Triangle 3
    0.00, 0.00, 0.0,   -0.75, 1.75, 0.0,   -1.75,  0.75, 0.0,
    // Triangle 4
    0.00, 0.00, 0.0,   -1.75, 0.75, 0.0,   -1.75, -0.75, 0.0,
    // Triangle 5
    0.00, 0.00, 0.0,   -1.75, -0.75, 0.0,   -0.75, -1.75, 0.0,
    // Triangle 6
    0.00, 0.00, 0.0,   -0.75, -1.75, 0.0,   0.75, -1.75, 0.0,
    // Triangle 7
    0.00, 0.00, 0.0,   0.75, -1.75, 0.0,   1.75, -0.75, 0.0,
    // Triangle 8
    0.00, 0.00, 0.0,   1.75, -0.75, 0.0,   1.75,  0.75, 0.0
  ]);

  geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
  geometry.computeVertexNormals();

  // Define per-vertex RGB colors (range 0.0 - 1.0)
  const colors = new Float32Array([
    0.5, 0.5, 0.5,   0.5, 0.5, 0.5,   0.5, 0.5, 0.5,  // Medium gray
    0.5, 0.5, 0.5,   0.5, 0.5, 0.5,   0.5, 0.5, 0.5,  // Medium gray
    0.5, 0.5, 0.5,   0.5, 0.5, 0.5,   0.5, 0.5, 0.5,  // Medium gray
    0.5, 0.5, 0.5,   0.5, 0.5, 0.5,   0.5, 0.5, 0.5,  // Medium gray
    0.5, 0.5, 0.5,   0.5, 0.5, 0.5,   0.5, 0.5, 0.5,  // Medium gray
    0.5, 0.5, 0.5,   0.5, 0.5, 0.5,   0.5, 0.5, 0.5,  // Medium gray
    0.5, 0.5, 0.5,   0.5, 0.5, 0.5,   0.5, 0.5, 0.5,  // Medium gray
    0.5, 0.5, 0.5,   0.5, 0.5, 0.5,   0.5, 0.5, 0.5,  // Medium gray
  ]);

  // Assign position and color attributes (itemSize = 3 components per vertex)
  geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  // Create a material that reads interpolated vertex colors
  const material = new THREE.MeshBasicMaterial({ 
    vertexColors: true, 
    side: THREE.DoubleSide 
  });

  return new THREE.Mesh(geometry, material);
}

const octagonOutlineMesh = createOctagonOutlineMesh();
scene.add(octagonOutlineMesh);

// 4. Initialize the WebGL Renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setClearColor(0x111111, 1.0); // Dark grey background
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// 5. Render the Frame
renderer.render(scene, camera);
    </script>
</body>
</html>
